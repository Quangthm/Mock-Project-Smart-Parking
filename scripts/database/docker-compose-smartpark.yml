# Historical single-database sandbox. For the integrated application use
# ../../compose.schema-integration.yml (three service-owned databases).
# Startup: docs/02-architecture/database/schema-integration.md (repo root).
services:
  postgres:
    image: postgres:16-alpine
    container_name: smartpark-postgres
    restart: always
    environment:
      POSTGRES_USER: smartpark_user
      POSTGRES_PASSWORD: park123
      POSTGRES_DB: smartpark_db
    ports:
      - "5434:5432"
    volumes:
      - smartpark_pgdata:/var/lib/postgresql/data
volumes:
  smartpark_pgdata:
