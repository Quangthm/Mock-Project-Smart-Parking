name: smartpark-tests
services:
  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      # Single source for test broker values; configure-test-settings.ps1 reads
      # the rendered service configuration for all test consumers.
      RABBITMQ_DEFAULT_USER: ${SMARTPARK_TEST_RABBITMQ_USER:-identity_test}
      RABBITMQ_DEFAULT_PASS: ${SMARTPARK_TEST_RABBITMQ_PASSWORD:-local-disposable-identity-test}
      RABBITMQ_DEFAULT_VHOST: ${SMARTPARK_TEST_RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:${SMARTPARK_RABBIT_TEST_PORT:-5679}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
