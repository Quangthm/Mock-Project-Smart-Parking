name: smartpark-schema
services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartpark_user
      POSTGRES_USER: smartpark_user
      POSTGRES_PASSWORD: ${SMARTPARK_DEV_PASSWORD:?Set SMARTPARK_DEV_PASSWORD}
    ports: ["127.0.0.1:${SMARTPARK_DB_USER_PORT:-5441}:5432"]
    volumes:
      - user-schema-data:/var/lib/postgresql/data
      - ./scripts/database/microservices/01-user-access-service-db.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./scripts/database/05.13-Mfa-Lifecycle.sql:/docker-entrypoint-initdb.d/02-feature.sql:ro
      - ./scripts/database/05.14-Identity-Access-Hardening.sql:/docker-entrypoint-initdb.d/03-feature.sql:ro
      - ./scripts/database/05.15-Owner-Onboarding.sql:/docker-entrypoint-initdb.d/04-feature.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpark_user -d smartpark_user"]
      interval: 5s
      timeout: 3s
      retries: 10
  facility-db:
    container_name: facility-db-1
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartpark_facility
      POSTGRES_USER: smartpark_facility
      POSTGRES_PASSWORD: ${SMARTPARK_DEV_PASSWORD:?Set SMARTPARK_DEV_PASSWORD}
    ports: ["127.0.0.1:${SMARTPARK_DB_PARKING_PORT:-5442}:5432"]
    volumes:
      - facility-schema-data:/var/lib/postgresql/data
      - ./scripts/database/microservices/02-facility-service-db.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./scripts/database/microservices/03a-parking-structure-ops-service-db.sql:/docker-entrypoint-initdb.d/02-base.sql:ro
      - ./scripts/database/overlay/parking-tenants.sql:/docker-entrypoint-initdb.d/03-overlay-tenants.sql:ro
      - ./scripts/database/overlay/parking-structure-synchronizations.sql:/docker-entrypoint-initdb.d/04-overlay-synchronizations.sql:ro
      - ./scripts/database/overlay/parking-operator-tables.sql:/docker-entrypoint-initdb.d/05-overlay-operator.sql:ro
      - ./scripts/database/overlay/parking-slot-constraints.sql:/docker-entrypoint-initdb.d/06-overlay-slot-constraints.sql:ro
      - ./scripts/database/05.16-Parking-Owner-Onboarding.sql:/docker-entrypoint-initdb.d/07-owner-onboarding.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpark_facility -d smartpark_facility"]
      interval: 5s
      timeout: 3s
      retries: 10
  operations-db:
    container_name: operations-db-1
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartpark_operations
      POSTGRES_USER: smartpark_operations
      POSTGRES_PASSWORD: ${SMARTPARK_DEV_PASSWORD:?Set SMARTPARK_DEV_PASSWORD}
    ports: ["127.0.0.1:${SMARTPARK_DB_RESERVATION_PORT:-5443}:5432"]
    volumes:
      - operations-schema-data:/var/lib/postgresql/data
      - ./scripts/database/microservices/03b-reservation-operations-service-db.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./scripts/database/overlay/reservation-site-capacity-pools.sql:/docker-entrypoint-initdb.d/02-overlay-capacity-pools.sql:ro
      - ./scripts/database/overlay/reservation-structure-safety.sql:/docker-entrypoint-initdb.d/03-overlay-structure-safety.sql:ro
      - ./scripts/database/overlay/reservation-structure-receipts.sql:/docker-entrypoint-initdb.d/04-overlay-receipts.sql:ro
      - ./scripts/database/overlay/reservation-confirmation-time.sql:/docker-entrypoint-initdb.d/05-overlay-confirmation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpark_operations -d smartpark_operations"]
      interval: 5s
      timeout: 3s
      retries: 10
  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartpark_payment
      POSTGRES_USER: smartpark_payment
      POSTGRES_PASSWORD: ${SMARTPARK_DEV_PASSWORD:?Set SMARTPARK_DEV_PASSWORD}
    ports: ["127.0.0.1:${SMARTPARK_DB_PAYMENT_PORT:-5444}:5432"]
    volumes:
      - payment-schema-data:/var/lib/postgresql/data
      - ./scripts/database/microservices/04-payment-pricing-service-db.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpark_payment -d smartpark_payment"]
      interval: 5s
      timeout: 3s
      retries: 10
  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartpark_notification
      POSTGRES_USER: smartpark_notification
      POSTGRES_PASSWORD: ${SMARTPARK_DEV_PASSWORD:?Set SMARTPARK_DEV_PASSWORD}
    ports: ["127.0.0.1:${SMARTPARK_DB_NOTIFICATION_PORT:-5445}:5432"]
    volumes:
      - notification-schema-data:/var/lib/postgresql/data
      - ./scripts/database/microservices/05-notification-audit-service-db.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpark_notification -d smartpark_notification"]
      interval: 5s
      timeout: 3s
      retries: 10
  iot-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartpark_iot
      POSTGRES_USER: smartpark_iot
      POSTGRES_PASSWORD: ${SMARTPARK_DEV_PASSWORD:?Set SMARTPARK_DEV_PASSWORD}
    ports: ["127.0.0.1:${SMARTPARK_DB_IOT_PORT:-5446}:5432"]
    volumes:
      - iot-schema-data:/var/lib/postgresql/data
      - ./scripts/database/microservices/06-iot-recognition-service-db.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpark_iot -d smartpark_iot"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smartpark-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${SMARTPARK_RABBITMQ_USER:-smartpark}
      RABBITMQ_DEFAULT_PASS: ${SMARTPARK_RABBITMQ_PASSWORD:?Set SMARTPARK_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${SMARTPARK_RABBITMQ_VHOST:-smartpark}
    ports:
      - "127.0.0.1:${SMARTPARK_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${SMARTPARK_RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


volumes:
  rabbitmq-data:
  user-schema-data:
  facility-schema-data:
  operations-schema-data:
  payment-schema-data:
  notification-schema-data:
  iot-schema-data:
