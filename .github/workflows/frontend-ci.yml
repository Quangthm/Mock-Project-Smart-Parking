name: Frontend CI (Lint, Build & Automated Tests)

on:
  pull_request:
    paths:
      - 'FE/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'FE/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  frontend-test:
    name: Frontend Build & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-directory: ~/.npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Run automated test suite (Unit, Component, MSW Integration, Node Regression)
        run: npm test

      - name: Run test coverage verification
        run: npm run test:coverage

