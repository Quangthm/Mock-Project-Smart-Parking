                - /url: https://aistudio.google.com/apps?utm_source=motionsites&utm_medium=partner&utm_campaign=26Q4-motionsites_ais&utm_content=text_dialog#prompt=%23%20Prompt%3A%20Strata%20AI%20hero%0A%0ABuild%20a%20single-file%2C%20dark%2C%20premium%20**AI-infrastructure%20landing%20hero**%20for%20a%20fictional%20company%2C%20**Strata%20AI**%20(%22trustworthy%20AI%2C%20built%20up%20layer%20by%20layer%22).%20Use%20plain%20HTML%2C%20CSS%20and%20vanilla%20JS%2C%20with%20no%20framework%20and%20no%20build%20step.%20One%20screen%20tall.%0A%0A%23%23%20Look%20and%20feel%0A%0A-%20**Overall%3A**%20near-black%20and%20calm%2C%20with%20a%20faint%20square%20grid%20in%20the%20background%2C%20white%20type%2C%20violet%20and%20teal%20accents%2C%20and%20soft%20glass%20surfaces.%0A-%20**Colours%3A**%0A%20%20-%20background%20%60%230d0c11%60%0A%20%20-%20ink%20%60%23ffffff%60%0A%20%20-%20nav%20grey%20%60%23b9b8bb%60%0A%20%20-%20muted%20text%20%60%23d3d3d7%60%0A%20%20-%20wordmark%20grey%20%60%23bdbdc1%60%0A%20%20-%20%22AI%22%20superscript%20%60%239ff0ec%60%0A%20%20-%20card%20kicker%20teal%20%60%23bdf7ee%60%0A%20%20-%20logo-row%20grey%20%60%23bcbcbf%60%0A%20%20-%20primary%20violet%20gradient%20%60%234d19b1%20%E2%86%92%20%236f5adc%60%0A-%20**Glass%20surfaces%3A**%20%60rgba(255%2C255%2C255%2C.02)%60%20fill%2C%20a%20%60rgba(255%2C255%2C255%2C.16)%60%20hairline%2C%20and%20%60backdrop-filter%3A%20blur(8px)%20brightness(1.15)%20saturate(.8)%60%2C%20with%20a%20faint%20inner%20white%20glow.%0A-%20**Type%3A**%0A%20%20-%20**DM%20Sans**%20(variable%2C%20weight%20~380)%20for%20the%20headline%2C%20stats%20numbers%20and%20logo-row%20words%0A%20%20-%20**Inter**%20(variable%2C%20~300%E2%80%93560)%20for%20everything%20else%0A%20%20-%20Self-host%20both%2C%20latin%20subset.%0A%0A%23%23%20Layout%20(desktop%2C%20landscape)%0A%0AThe%20whole%20hero%20is%20drawn%20on%20a%20**2048%C3%971455%20design%20canvas**%20scaled%20by%20one%20unit%2C%20%60--u%20%3D%20viewport%20height%20%2F%201455%60%20(minimum%200.468px).%20The%20canvas%20is%20centred%2C%20the%20screen%20is%20always%20filled%20top%20to%20bottom%2C%20and%20any%20spare%20width%20is%20just%20background.%0A%0A1.%20**Header**%20(148u%20tall)%3A%0A%20%20%20-%20**Left%3A**%20a%2070%C3%9769u%20violet%20gradient%20tile%20with%20a%20bold%20white%20**S**%20and%20a%20soft%20violet%20glow%2C%20then%20the%20light-grey%20wordmark%20**%22Strata%22**%20with%20a%20small%20teal%20**%22AI%22**%20superscript%20sitting%20above%20its%20last%20letters.%0A%20%20%20-%20**Centre%3A**%20six%20nav%20links%2C%20about%2048u%20apart%3A%20**Platform%20%C2%B7%20Model%20Scores%20%C2%B7%20Industries%20%C2%B7%20Defense%20AI%20%C2%B7%20Use%20cases%20%C2%B7%20Changelog**.%0A%20%20%20-%20**Right%3A**%20**%22Log%20in%22**%2C%20then%20an%20outlined%20glass%20pill%2C%20**%22Meet%20Strata%22**%20(202%C3%9763u).%0A2.%20**Left%20column**%20(x%20%3D%20150u)%3A%0A%20%20%20-%20**Headline%3A**%20three%20lines%20at%20104u%20%2F%20122u%20line-height%3A%20**%22Grounded%20models%20%2F%20made%20of%20data%20%2F%20you%20trust.%22**%20Each%20line%20stays%20on%20one%20line%20and%20fades%20from%20white%20to%20soft%20grey%20at%20the%20right.%0A%20%20%20-%20**Subline%3A**%20at%2029.5u%20in%20light%20grey%3A%20%22Strata%20layers%20verified%20data%2C%20evaluations%2C%20and%20audits%20for%20model%20teams%2C%20public%20agencies%2C%20and%20enterprise%20operations.%22%0A%20%20%20-%20**Buttons%3A**%20two%2085u-tall%20pills%2C%20a%20violet-gradient%20**%22Meet%20Strata%22**%20and%20a%20dark%20glass%20**%22Try%20Free%22**.%0A%20%20%20-%20**Stats%20row%3A**%20**2.1B**%20labels%20%C2%B7%20**400%252B**%20evals%20%C2%B7%20**99.9%2525**%20uptime.%20The%20numbers%20are%20DM%20Sans%2050u%20and%20the%20labels%20are%2025u%20grey%2C%20separated%20by%20thin%20vertical%20hairlines.%0A3.%20**Right%20half%3A**%20a%20large%20square%20artwork%20(about%201120u%2C%20centred%20near%20x%20%3D%201550u).%20It%20shows%20four%20floating%20translucent%20**glass%20data%20slabs**%20at%20an%20isometric%20angle%2C%20glowing%20teal%20%E2%86%92%20violet%3A%0A%20%20%20-%20a%20grid%20of%20data%20points%0A%20%20%20-%20flowing%20light%20waves%0A%20%20%20-%20pixel%20blocks%0A%20%20%20-%20a%20violet%20haze%0A%20%20%20Its%20edges%20fade%20into%20the%20background%20with%20a%20radial%20mask%2C%20so%20there's%20no%20visible%20box.%0A4.%20**Two%20glass%20cards**%20(451%C3%97201u%2C%20radius%2018u)%20overlap%20the%20artwork.%20Each%20has%20a%2063u%20icon%20tile%2C%20a%20teal%20kicker%20and%20a%20two-line%20white%20title%3A%0A%20%20%20-%20**Upper-left%20of%20the%20slabs%3A**%20kicker%20**%22Benchmarking%22**%2C%20title%20%22STRATA%20Index%3A%20Peer-Scored%2C%20%2F%20Private%20Model%20Evaluations.%22%2C%20with%20a%20teal%20network-graph%20icon.%0A%20%20%20-%20**Lower-right%3A**%20kicker%20**%22Red-team%22**%2C%20title%20%22BASTION%3A%20Adversarial%20Test%20%2F%20for%20Critical%20Systems.%22%2C%20with%20a%20teal%20fortress-and-padlock%20icon.%0A5.%20**Logo%20row**%20at%20the%20bottom%2C%20centred%20and%20grey%3A%20**Arbor**%20(bold%20italic)%20%C2%B7%20**Nova**%20(bold%20italic)%20%C2%B7%20**lumina**%20(regular%2C%20wide%20tracking)%20%C2%B7%20**HALCYONIX**%20(bold%20italic%20caps).%0A%0A%23%23%20Motion%0A%0A-%20**Artwork%3A**%20loops.%20The%20slabs%20bob%20and%20drift%20slightly%2C%20data%20particles%20flow%20across%20the%20top%20slab%2C%20the%20waves%20ripple%20and%20the%20pixel%20blocks%20flicker.%0A-%20**Entrance%3A**%20one%20Web%20Animations%20timeline%20runs%20once%20on%20load%2C%20then%20the%20page%20is%20static.%0A%20%20-%20the%20header%20items%20rise%20and%20fade%20in%2C%20left%20to%20right%0A%20%20-%20each%20headline%20line%20rises%20out%20of%20its%20own%20clip%20mask%2C%200.12s%20apart%0A%20%20-%20the%20subline%20settles%2C%20then%20the%20buttons%20(the%20primary%20with%20a%201.5%2525%20scale%20settle)%0A%20%20-%20the%20stats%20rise%20in%20one%20by%20one%2C%20then%20the%20two%20glass%20cards%20lift%20in%0A%20%20-%20the%20logo%20row%20fades%20in%2C%20left%20to%20right%0A-%20**Reduced%20motion%3A**%20no%20entrance%2C%20no%20loop%3B%20the%20still%20shows%20instead.%0A%0A%23%23%20Smaller%20screens%0A%0AThe%20same%20content%20reflows%20into%20one%20centred%20column%3A%20logo%20with%20a%20round%20menu%20button%20that%20opens%20a%20glass%20dropdown%20panel%2C%20the%20headline%2C%20subline%2C%20buttons%2C%20stats%2C%20then%20the%20artwork%20with%20the%20two%20cards%20staggered%20over%20it%2C%20then%20the%20logo%20row.%20Use%20a%20fluid%20unit%20%60--f%20%3D%20clamp(.55px%2C%20.449px%20%252B%20.0284vw%2C%20.76px)%60%20and%2016%E2%80%9340px%20side%20margins.%0A%0A%23%23%20Media%20(use%20these%20URLs)%0A%0A-%20**Artwork%20loop%3A**%20%60https%3A%2F%2Fd2ol7oe51mr4n9.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2F435a4fe7-e43b-4e7c-af78-0be083e73569.mp4%60%20(960%C3%97960%2C%205s%2C%20H.264%2C%20muted%2C%20loops%3B%20first%20frame%20%3D%20last%20frame).%20Show%20it%20inside%20the%20masked%20artwork%20box.%0A-%20**Artwork%20still**%20(poster%20and%20fallback)%3A%20%60https%3A%2F%2Fd2ol7oe51mr4n9.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2F782a4a52-4c1e-4471-bb0c-aa232927f4a6.webp%60%20(1200%C3%971200%20WebP).%0A%0A%23%23%20Acceptance%20check%20(1440%C3%97900)%0A%0A-%20**Left%3A**%20the%20three-line%20headline%20sits%20top-left%2C%20with%20its%20first%20line%20ending%20just%20before%20the%20%22Benchmarking%22%20card.%20The%20subline%2C%20buttons%20and%20stats%20follow%2C%20with%20even%20spacing.%0A-%20**Right%3A**%20the%20glowing%20slab%20stack%20fills%20the%20right%20half%20and%20moves%2C%20with%20the%20two%20cards%20overlapping%20it.%0A-%20**Bottom%3A**%20four%20fictional%20logos%20sit%20centred%20along%20the%20bottom%20edge.%0A-%20**Content%3A**%20no%20real%20company%20or%20product%20names%20appear%20anywhere.
